# Mosquitto Configuration for EMS

# Listener for MQTT protocol
listener 1883
protocol mqtt

# Listener for WebSockets (optional - for web dashboards)
listener 9001
protocol websockets

# Allow anonymous connections (set to false in production)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# Connection settings
max_connections -1
